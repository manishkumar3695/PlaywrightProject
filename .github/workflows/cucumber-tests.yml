name: Playwright Cucumber Tests

on:
  push:
    branches:
      - main
      - master
      - develop
  pull_request:
    branches:
      - main
      - master
      - develop

jobs:
  test-agent-1:
    name: Test Agent 1
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18.x

      - name: Install dependencies
        run: npm install

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Run Cucumber tests - Agent 1
        run: npx cucumber-js --tags "@events"

      - name: Generate HTML report
        if: always()
        run: node generate-report.js

      - name: Upload Cucumber report - Agent 1
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cucumber-report-agent-1
          path: reports/cucumber-report.html

  test-agent-2:
    name: Test Agent 2
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18.x

      - name: Install dependencies
        run: npm install

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Run Cucumber tests - Agent 2
        run: npx cucumber-js --tags "@test"

      - name: Generate HTML report
        if: always()
        run: node generate-report.js

      - name: Upload Cucumber report - Agent 2
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cucumber-report-agent-2
          path: reports/cucumber-report.html

  merge-results:
    name: Merge Test Results
    runs-on: ubuntu-latest
    needs: [test-agent-1, test-agent-2]
    if: always()

    steps:
      - name: Download Agent 1 report
        uses: actions/download-artifact@v4
        with:
          name: cucumber-report-agent-1

      - name: Download Agent 2 report
        uses: actions/download-artifact@v4
        with:
          name: cucumber-report-agent-2

      - name: Summary
        run: |
          echo "✅ Agent 1 completed"
          echo "✅ Agent 2 completed"
          echo "📊 Both agents finished successfully"
